version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: messaging-db
    restart: always
    env_file:
      - .env
    volumes:
      - mysql_data:/var/lib/mysql
    expose:
      - "3306" # Exposes the default MySQL port internally

  web:
    build: .
    container_name: messaging-web
    restart: always
    command: python manage.py runserver 0.0.0.0:8000
    env_file:
      - .env
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
    
volumes:
  mysql_data:
